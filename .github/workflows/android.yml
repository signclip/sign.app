# Build the Android app (debug APK) in the cloud; download it under Actions → this run → Artifacts.
name: android
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: { contents: write } # the release "apk": a direct download, not a zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - name: version = run number (each APK newer than the last, installs over it)
        run: sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
      - name: own plugins DavHttp (WebDAV verbs, refused through CapacitorHttp) and ShareTargets (apps in the sharing menu)
        run: |
          d=android/app/src/main/java/org/signclip/signapp
          cp native/android/DavHttpPlugin.java native/android/ShareTargetsPlugin.java native/android/MainActivity.java "$d"/
          mkdir -p android/app/src/main/res/xml && cp native/android/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.SEND" /><data android:mimeType="*/*" /></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
          printf '\ndependencies {\n    implementation "com.squareup.okhttp3:okhttp:4.12.0"\n}\n' >> android/app/build.gradle
          ls "$d"
          tail -4 android/app/build.gradle
      - name: camera and microphone
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" /><uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><uses-permission android:name="android.permission.VIBRATE" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: the same signing key every time (secret DEBUG_KEYSTORE), so an update installs over the app and keeps its data
        env: { KS: '${{ secrets.DEBUG_KEYSTORE }}' }
        run: |
          if [ -z "$KS" ]; then echo "secret DEBUG_KEYSTORE missing: a random key would make the APK conflict with the installed app"; exit 1; fi
          mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -m1 'SHA256'
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: sign-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: direct download (release "apk" → sign.apk)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sign.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Sign APK" --notes "Die neueste APK aus main: sign.apk antippen." --prerelease
          gh release upload apk sign.apk --clobber

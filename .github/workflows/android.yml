# Build the Android app (debug APK) in the cloud; download it under Actions → this run → Artifacts.
name: android
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - name: camera and microphone
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" /><uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: the same signing key every time (secret DEBUG_KEYSTORE), so an update installs over the app and keeps its data
        env: { KS: '${{ secrets.DEBUG_KEYSTORE }}' }
        run: if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; fi
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: sign-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }

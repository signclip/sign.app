# Build the Android app in the cloud; download it under Actions → this run → Artifacts, or as release "apk".
# Which build (27.11., audit M6):
#   repository variable APK_BUILD = release → a release build (not debuggable); unset → the debug build, as before
#   secret RELEASE_KEYSTORE (Base64) with RELEASE_STORE_PASSWORD and RELEASE_KEY_PASSWORD → signed with that key;
#   without it → DEBUG_KEYSTORE, as before. A new key makes a new app: it does not install over the old one.
# Actions are named by their commit, packages come from package-lock.json (npm ci): the same bytes every run (M7).
name: android
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: { contents: write } # the release "apk": a direct download, not a zip
    env:
      BUILD: ${{ vars.APK_BUILD == 'release' && 'release' || 'debug' }}
      KS_PASS: ${{ secrets.RELEASE_KEYSTORE && secrets.RELEASE_STORE_PASSWORD || 'android' }}
      KEY_PASS: ${{ secrets.RELEASE_KEYSTORE && secrets.RELEASE_KEY_PASSWORD || 'android' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: the three libraries beside the app, each checked against its SHA-512 (native/libs.sh)
        run: sh native/libs.sh web/lib
      - run: npx cap add android && npx cap sync android
      - name: no backup, no clear text (native/android/harden.sh)
        run: sh native/android/harden.sh
      - name: version = run number (each APK newer than the last, installs over it)
        run: sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
      - name: own plugins DavHttp (WebDAV verbs, refused through CapacitorHttp), ShareTargets (apps in the sharing menu), SignKeys (Android Keystore)
        run: |
          d=android/app/src/main/java/org/signclip/signapp
          cp native/android/DavHttpPlugin.java native/android/ShareTargetsPlugin.java native/android/SignKeysPlugin.java native/android/MainActivity.java "$d"/
          mkdir -p android/app/src/main/res/xml && cp native/android/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.SEND" /><data android:mimeType="*/*" /></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
          printf '\ndependencies {\n    implementation "com.squareup.okhttp3:okhttp:4.12.0"\n}\n' >> android/app/build.gradle
          ls "$d"
          tail -4 android/app/build.gradle
      - name: the app's own link org.signclip.signapp:// (20.11.; back from the browser with the Admin password, confirm.html)
        run: |
          sed -i 's#</activity>#    <intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="org.signclip.signapp" /></intent-filter>\n        </activity>#' android/app/src/main/AndroidManifest.xml
          grep -c 'android:scheme="org.signclip.signapp"' android/app/src/main/AndroidManifest.xml
          grep -o 'launchMode="[a-zA-Z]*"' android/app/src/main/AndroidManifest.xml
      - name: the app icon (native/android/res, drawn by native/icon.py)
        run: cp -R native/android/res/. android/app/src/main/res/ && ls android/app/src/main/res/mipmap-xxxhdpi
      - name: camera and microphone
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" /><uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><uses-permission android:name="android.permission.VIBRATE" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: the same signing key every time, so an update installs over the app and keeps its data
        env: { KS: '${{ secrets.RELEASE_KEYSTORE || secrets.DEBUG_KEYSTORE }}' }
        run: |
          if [ -z "$KS" ]; then echo "no signing key (secret DEBUG_KEYSTORE or RELEASE_KEYSTORE): a random key would make the APK conflict with the installed app"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/sign.keystore"
          sh native/android/signing.sh "$RUNNER_TEMP/sign.keystore"
      - run: cd android && ./gradlew "assemble$([ "$BUILD" = release ] && echo Release || echo Debug)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: 'sign-${{ env.BUILD }}-apk', path: 'android/app/build/outputs/apk/${{ env.BUILD }}/app-${{ env.BUILD }}.apk' }
      - name: direct download (release "apk" → sign.apk)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp "android/app/build/outputs/apk/$BUILD/app-$BUILD.apk" sign.apk
          v=sign-1.${{ github.run_number }}.apk; cp sign.apk "$v" # a name per version: no phone can open an older cached download by mistake
          sh native/android/signed.sh sign.apk "$RUNNER_TEMP/sign.keystore" || { echo "the APK is not signed with the project's key: it would conflict with the installed app"; exit 1; }
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Sign APK" --notes "Die neueste APK aus main: sign.apk antippen." --prerelease
          for old in $(gh release view apk --json assets --jq '.assets[].name' | grep '^sign-1\.' || true); do gh release delete-asset apk "$old" -y; done
          gh release upload apk sign.apk "$v" --clobber

<!DOCTYPE html>
<!-- confirm.html — the Admin account's own password, typed here and handed to the app sealed (9-ui/confirm-admin.js). -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- The page a password is typed into loads its one script and nothing else (27.11., audit M9). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Sign · Admin</title>
  <style>
    :root { --bg: #e4e2dd; --card: #faf8f4; --fg: #2c2a26; --mut: #8a867e; --rc: #f5c4b3; --rc-stroke: #e8907a; --line: #d3d0c8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font: 400 16px Inter, system-ui, sans-serif; }
    form { width: min(340px, 90vw); display: flex; flex-direction: column; gap: 14px; align-items: center; }
    .who { width: 120px; height: 120px; border-radius: 50%; background: var(--card); border: 3px solid var(--rc-stroke); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .who b { font-weight: 600; font-size: 17px; } .who small { color: var(--mut); font-size: 11px; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    input { width: 100%; font: inherit; font-size: 18px; padding: 14px 18px; border-radius: 24px; border: 2px solid var(--line); background: var(--card); color: var(--fg); outline: none; text-align: center; }
    input:focus { border-color: var(--rc-stroke); }
    input[name=username] { position: absolute; left: -9999px; }
    button { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--rc-stroke); background: var(--rc); font: 600 24px Inter, system-ui, sans-serif; color: #4A1B0C; cursor: pointer; }
    button:disabled { opacity: .35; }
    p { margin: 0; color: var(--mut); font-size: 13px; text-align: center; min-height: 1.2em; }
  </style>
</head>
<body>
  <form id="f" autocomplete="on">
    <div class="who"><b id="user">Admin</b><small id="server"></small></div>
    <input name="username" id="username" autocomplete="username" readonly tabindex="-1">
    <input name="password" id="password" type="password" autocomplete="current-password" required autofocus aria-label="Passwort">
    <button id="ok" type="submit" disabled>→</button>
    <p id="note"></p>
  </form>
  <script type="module" src="./9-ui/confirm-page.js"></script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <meta name="theme-color" content="#e4e2dd">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="9-ui/look.css">
  <title>Sign</title>
</head>
<body>
  <div id="screen" data-role="screen">
    <div id="window" data-role="window">
      <video id="live" autoplay muted playsinline disablepictureinpicture></video>
      <video id="replay" hidden playsinline disablepictureinpicture></video>
    </div>
    <video id="pickvideo" hidden playsinline muted disablepictureinpicture></video>
    <div id="similar"></div>
    <svg id="take" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="now"></div>
    <div id="row" data-role="context"></div>
    <input id="say" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="context">
    <div id="note"></div>
    <div id="sharing" hidden data-role="sharing">
      <svg id="sharing-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="sharing-html"></div>
    </div>
    <svg id="hint" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <script type="module">
    import { start } from './9-ui/app.js';
    const load = (l) => fetch(`0-i18n/locales/${l}.json`).then((r) => r.json());
    const [de, en] = await Promise.all([load('de'), load('en')]);
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
    start({ locales: { de, en } });
  </script>
</body>
</html>

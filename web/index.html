<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAECE7">
  <link rel="manifest" href="manifest.json">
  <title>Sign</title>
  <style>
    html, body { margin: 0; height: 100%; background: #FFFBF7; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
    #live { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; aspect-ratio: 1 / 1; }
    .fields { position: absolute; top: env(safe-area-inset-top, 12px); left: 12px; right: 12px; display: flex; gap: 8px; }
    [data-strand] { flex: 1; height: 48px; border-radius: 24px; background: #FAECE7cc; border: 1.5px solid #D85A30; }
    [data-strand].held { background: #D85A30; }
    #point { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); left: 50%; transform: translateX(-50%); width: 96px; height: 96px; }
    #similar { position: absolute; top: 72px; right: 0; width: 42%; bottom: 140px; background: #E6F1FBdd; border-radius: 16px 0 0 16px; padding: 12px; overflow: auto; }
    #own { position: absolute; top: 72px; left: 0; width: 46%; bottom: 140px; background: #FAECE7ee; border-radius: 0 16px 16px 0; padding: 12px; overflow: auto; }
    .chip.on { outline: 2px solid #D85A30; }
    #own .chip { background: #fff; color: #712B13; border: 1px solid #D85A30; }
    .chip { display: inline-block; margin: 4px; padding: 6px 12px; border-radius: 16px; background: #378ADD; color: #fff; }
  </style>
</head>
<body>
  <video id="live" autoplay muted playsinline></video>
  <div class="fields"><div data-strand="v"></div><div data-strand="a"></div><div data-strand="x"></div><div data-strand="l"></div></div>
  <div id="similar" hidden></div>
  <div id="own" hidden></div>
  <div id="point" role="button"></div>
  <script type="module">
    import { start } from './9-ui/app.js';
    const load = (l) => fetch(`0-i18n/locales/${l}.json`).then((r) => r.json());
    const [de, en] = await Promise.all([load('de'), load('en')]);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    start({ locales: { de, en } });
  </script>
</body>
</html>

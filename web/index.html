<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAECE7">
  <link rel="manifest" href="manifest.json">
  <title>Sign</title>
  <style>
    :root {
      --bg: #faf9f7; --fg: #222; --mut: #8a8984; --card: #fff; --line: #e8e6e1;
      --rc: #f5c6b8; --rc-stroke: #C8644A; --sc: #b9d4ee; --sc-stroke: #3F78C4;
      --hold: #5fbf92; --hl: #ffe9a0; --video: #2F323A;
    }
    @media (prefers-color-scheme: dark) { :root { --bg: #171716; --fg: #eeece7; --card: #222; --line: #333; --hl: #5f5010; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; overflow: hidden; touch-action: none; }
    #screen { position: absolute; inset: 0; }
    #screen video { position: absolute; object-fit: cover; background: var(--video); }
    #overlay, #overlay svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #overlay [data-role] { cursor: pointer; }
    /* the view's classes (view/ring.js, chips.js, timeline.js): colour never alone, dashed / filled say it too */
    .layer { fill: none; stroke: var(--rc-stroke); stroke-width: 2; opacity: .25; }
    .strand { fill: none; stroke-width: 7; stroke-linecap: round; }
    .strand.new { stroke: var(--rc-stroke); stroke-dasharray: 10 8; }
    .strand.keep, .strand.own { stroke: var(--rc-stroke); }
    .strand.off { stroke: var(--mut); stroke-width: 3; opacity: .5; }
    .video { fill: none; } .video.faded { opacity: .55; }
    .video.other { stroke: var(--sc-stroke); stroke-width: 3; }
    .bar { stroke-width: 3; stroke-linecap: round; } .bar.own { stroke: var(--rc-stroke); } .bar.other { stroke: var(--sc-stroke); }
    .chip rect { stroke-width: 1.5; } .chip text { font: 500 14px Inter, system-ui, sans-serif; fill: #1d1b20; }
    .chip.own rect { fill: var(--rc); stroke: var(--rc-stroke); } .chip.head rect { fill: var(--rc-stroke); } .chip.head text { fill: #fff; }
    .chip.now rect { fill: var(--hl); stroke: var(--rc-stroke); } .chip.now text { font-weight: 600; }
    .chip.later rect { fill: var(--card); stroke: var(--line); } .chip.later text { fill: var(--mut); }
    .chip.wait rect { fill: none; stroke: var(--rc-stroke); stroke-dasharray: 5 4; }
    .bubble { fill: var(--rc); opacity: .45; } .bubble.now { fill: var(--hl); opacity: .8; }
    .thread { fill: none; stroke-width: 3; } .thread.own { stroke: var(--rc-stroke); opacity: .5; } .thread.other { stroke: var(--sc-stroke); }
    .thumb { stroke-width: 3; fill: var(--video); } .thumb.own { stroke: var(--rc-stroke); } .thumb.other { stroke: var(--sc-stroke); } .thumb.far { opacity: .4; }
    .now-mark { stroke: var(--fg); stroke-width: 2; opacity: .5; }
    .point .ring { fill: none; stroke: var(--rc-stroke); stroke-width: 3; } .point .core { fill: var(--rc-stroke); }
    .point.waiting .ring { stroke-dasharray: 8 6; } .point.line .core { opacity: .55; }
    /* panels slide in from the edges */
    body.full #own, body.full #similar, body.full #chips, body.full #share { display: none; }
    #chips { position: absolute; top: 72px; left: 12px; right: 12px; text-align: center; }
    #similar { position: absolute; top: 72px; right: 0; width: 42%; bottom: 140px; background: #E6F1FBdd; border-radius: 16px 0 0 16px; padding: 12px; overflow: auto; }
    #own { position: absolute; top: 72px; left: 0; width: 46%; bottom: 140px; background: #FAECE7ee; border-radius: 0 16px 16px 0; padding: 12px; overflow: auto; }
    /* sharing points after ↑ on the point (view/points.js): a layer over the screen, only the shapes take touches */
    #share { position: absolute; inset: 0; pointer-events: none; }
    #share .points, #share svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #share [data-role] { pointer-events: auto; cursor: pointer; }
    #share .note { position: absolute; left: 0; right: 0; bottom: 24px; text-align: center; color: var(--mut); font-size: 0.9em; }
    #share:not([hidden]) .points { animation: sheet-up .22s ease-out; }
    @keyframes sheet-up { from { transform: translateY(30%); opacity: 0; } to { transform: none; opacity: 1; } }
    .tile-behind { fill: var(--card); stroke: var(--line); pointer-events: none; }
    .sheet { fill: var(--card); stroke: var(--line); filter: drop-shadow(0 -2px 8px rgba(0,0,0,.08)); }
    .handle { stroke: var(--mut); stroke-width: 4; stroke-linecap: round; }
    .sp { fill: var(--card); stroke: var(--mut); stroke-width: 1.5; }
    .sp.own-device { fill: var(--rc); stroke: var(--rc-stroke); }
    .sp.always { stroke: var(--rc-stroke); stroke-width: 2.5; }
    .sp.shown { fill: var(--sc); }
    .sp.focus { stroke: var(--hold); stroke-width: 4; }
    .sp.waiting, .sp.error, .sp.closed, .sp.device { stroke-dasharray: 5 4; opacity: .55; }
    .sp.add { fill: none; stroke-dasharray: 5 4; } .sp.add.now { stroke: var(--rc-stroke); stroke-width: 2.5; }
    .sp.folder { fill: var(--sc); }
    .sp.group { stroke: var(--sc-stroke); stroke-width: 2.5; }
    .badge { fill: var(--card); stroke: var(--sc-stroke); stroke-width: 2; stroke-dasharray: 3 2; pointer-events: none; } .badge.joined { fill: var(--sc); stroke-dasharray: none; }
    .hello { fill: none; stroke: var(--sc-stroke); stroke-width: 2.5; stroke-dasharray: 6 4; } .hello-dot { fill: var(--sc-stroke); pointer-events: none; }
    .sp.cloud { fill: none; stroke: var(--sc-stroke); stroke-width: 2; }
    .sp.incoming { fill: none; stroke: var(--sc-stroke); stroke-width: 2.5; stroke-dasharray: 6 4; } .sp.incoming.there { fill: var(--sc); fill-opacity: .4; }
    .glyph { fill: none; stroke: var(--mut); stroke-width: 1.5; pointer-events: none; }
    .strand.mini { stroke-width: 5; stroke-linecap: round; }
    .hit { fill: none; stroke: transparent; stroke-width: 22; }
    .bridge { stroke: var(--rc-stroke); stroke-width: 6; opacity: .35; } .bridge.backup { stroke-dasharray: 3 3; opacity: .6; }
    .label { font: 500 12px Inter, system-ui, sans-serif; fill: var(--fg); pointer-events: none; }
    .chip.on { outline: 2px solid var(--rc-stroke); }
    #own .chip { background: var(--card); color: #712B13; border: 1px solid var(--rc-stroke); }
    span.chip { display: inline-block; margin: 4px; padding: 6px 12px; border-radius: 16px; background: var(--sc-stroke); color: #fff; }
  </style>
</head>
<body>
  <div id="screen">
    <video id="live" autoplay muted playsinline></video>
    <video id="replay" hidden playsinline loop></video>
    <video id="template" hidden playsinline muted loop></video>
    <div id="overlay"></div>
  </div>
  <div id="chips" hidden></div>
  <div id="similar" hidden></div>
  <div id="own" hidden></div>
  <div id="share" hidden></div>
  <script type="module">
    import { start } from './9-ui/app.js';
    const load = (l) => fetch(`0-i18n/locales/${l}.json`).then((r) => r.json());
    const [de, en] = await Promise.all([load('de'), load('en')]);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    start({ locales: { de, en } });
  </script>
</body>
</html>

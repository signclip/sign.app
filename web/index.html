<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAECE7">
  <link rel="manifest" href="manifest.json">
  <title>Sign</title>
  <style>
    :root {
      --bg: #faf9f7; --rest: #e4e2dd; --fg: #222; --mut: #8a8984; --card: #fff; --line: #e8e6e1;
      --rc: #f5c6b8; --rc-stroke: #f5a08a; --sc: #b9d4ee; --sc-stroke: #8fb6e0;
      --hold: #5fbf92; --hl: #ffe9a0; --video: #2F323A;
    }
    @media (prefers-color-scheme: dark) { :root { --bg: #171716; --fg: #eeece7; --card: #222; --line: #333; --hl: #5f5010; --rest: #2b2b29; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; overflow: hidden; touch-action: none; }
    #screen { position: absolute; inset: 0; }
    #screen video { position: absolute; object-fit: cover; background: transparent; opacity: 0; transition: opacity .45s ease-out; }
    #screen video.on { opacity: 1; } /* only once a frame plays: no black box, no grey play button */
    video::-webkit-media-controls, video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
    /* start: plain background → picture fades in → the shapes follow (app.js adds .ready) */
    #overlay { opacity: 0; transform: scale(.985); transition: opacity .5s ease-out .25s, transform .5s ease-out .25s; }
    #screen.ready #overlay { opacity: 1; transform: none; }
    #overlay, #overlay svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #overlay [data-role] { cursor: pointer; }
    /* the view's classes (view/ring.js, chips.js, timeline.js): colour never alone, dashed / filled say it too */
    .layer { fill: none; stroke: var(--rc-stroke); stroke-width: 2; opacity: .25; }
    .field-rest { fill: var(--rest); pointer-events: none; } /* outside the window nothing shows (14.11.): the whole square in review */
    .corner { fill: transparent; } /* a corner of the window to drag */
    * { -webkit-tap-highlight-color: transparent; } [data-role]:focus { outline: none; } /* the arcs answer themselves, no blue box */
    #screen { background: var(--rest); } /* 14.11.: the grey around the window is the whole background */
    .strand { fill: none; stroke-width: 7; stroke-linecap: round; }
    .strand.new { stroke: var(--rc-stroke); opacity: .55; } /* will be recorded: pale, solid (14.11.) */
    .strand.keep, .strand.own { stroke: var(--rc-stroke); }
    .strand.off { stroke: var(--mut); stroke-width: 3; opacity: .5; }
    .chip.hold rect, .bubble.hold { stroke: var(--hold); stroke-width: 4; }
    .strand.hold { stroke: var(--hold); stroke-width: 11; }
    .strand.wave { stroke-width: 4; } /* landmarks: short and wavy, above the point */
    .flow { fill: none; stroke-width: 4; stroke-linecap: round; } .flow.own { stroke: var(--rc-stroke); } .flow.waiting { stroke: var(--mut); stroke-dasharray: 4 5; }
    .bubble.sticky { fill: var(--rc); opacity: .7; stroke: var(--rc-stroke); stroke-width: 1.5; } /* held as property: thicker too, not colour alone */
    .video { fill: none; } .video.faded { opacity: .55; }
    .video.other { stroke: var(--sc-stroke); stroke-width: 3; }
    .feedback { fill: none; stroke-width: 4; pointer-events: none; } .feedback.saved { stroke: #5fbf92; } .feedback.gone { stroke: #e57373; stroke-dasharray: 6 5; }
    .wait-ring { fill: none; stroke: var(--rc-stroke); stroke-width: 2; pointer-events: none; } .wait-ring.start { stroke-dasharray: 3 4; }
    .bar { stroke-width: 3; stroke-linecap: round; opacity: .7; } .bar.now { opacity: 1; stroke-width: 4; } .bar.own { stroke: var(--rc-stroke); } .bar.other { stroke: var(--sc-stroke); }
    .chip rect { stroke-width: 1.5; } .chip text { font: 500 14px Inter, system-ui, sans-serif; fill: #1d1b20; }
    .chip.own rect { fill: var(--rc); stroke: var(--rc-stroke); } .chip.head rect { fill: var(--rc-stroke); } .chip.head text { fill: #fff; }
    .chip.now rect { fill: var(--hl); stroke: var(--rc-stroke); } .chip.now text { font-weight: 600; }
    .chip.later rect { fill: var(--card); stroke: var(--line); } .chip.later text { fill: var(--mut); }
    .chip.wait rect { fill: none; stroke: var(--rc-stroke); stroke-dasharray: 5 4; }
    .bubble { fill: var(--rc); opacity: .45; } .bubble.now { fill: var(--hl); opacity: .8; }
    .thread { fill: none; stroke-width: 3; } .thread.own { stroke: var(--rc-stroke); opacity: .5; } .thread.other { stroke: var(--sc-stroke); }
    .thumb { stroke-width: 3; fill: var(--video); } .thumb.own { stroke: var(--rc-stroke); } .thumb.other { stroke: var(--sc-stroke); } .thumb.far { opacity: .4; }
    /* the line in its arc over the point, the chain under it (view/arc.js) */
    .from.own { fill: var(--rc-stroke); } .from.other { fill: var(--sc-stroke); } /* review: own line coral, from Similar blue */
    .thumb.seen { fill: transparent; } #overlay image { pointer-events: none; } .video.reference { fill: transparent; }
    .thumb.now { stroke-width: 4; stroke: var(--rc-stroke); } .thumb.own:not(.now) { stroke-width: 1.5; }
    .thread.line-arc { opacity: .75; } .thumb.near { stroke-width: 2.5; } .thread.level { opacity: .22; stroke-width: 2; } .thread.level.open { opacity: .45; stroke-dasharray: 6 5; }
    .thread.level.chosen { opacity: .9; stroke-width: 4; stroke-dasharray: none; } .thumb.chosen { opacity: 1; } .back { opacity: .3; }
    .arriving { opacity: .6; } .thumb.flying { stroke-width: 3; }
    .now-mark { stroke: var(--fg); stroke-width: 2; opacity: .5; }
    .point .ring { fill: none; stroke: var(--rc-stroke); stroke-width: 3; } .point .core { fill: var(--rc-stroke); }
    .point.photo .core { fill: var(--card); stroke: var(--rc-stroke); stroke-width: 6; } /* photo button: a white disc in a ring */
    .photo { fill: var(--card); stroke: var(--mut); stroke-width: 2; } .photo.on { fill: var(--rc); stroke: var(--rc-stroke); stroke-width: 3; }
    .point.waiting .ring { stroke-dasharray: 8 6; } .point.line .core { opacity: .55; }
    .point.with .ring { stroke: var(--hold); stroke-width: 5; } /* the point acts on the held property */
    /* panels slide in from the edges */
    body.full #similar, body.full #chips, body.full #share { display: none; }
    #chips { position: absolute; top: 72px; left: 12px; right: 12px; text-align: center; }
    #similar { position: absolute; top: 8px; left: 8px; right: 8px; height: 44px; white-space: nowrap; overflow-x: auto; overflow-y: hidden; } /* metadata and strand choice above the tiles */
    #similar .chip { background: var(--sc); color: #0C447C; } #similar .chip.on { outline: 2px solid var(--sc-stroke); }
    .similar-band { fill: var(--sc); opacity: .18; }
    #context { position: absolute; left: 12px; right: 12px; top: calc(var(--field-y, 640px) - 24px); } /* right under the bottom arc; Android's buttons stay free */
    #context input { width: 100%; box-sizing: border-box; font: 500 17px Inter, system-ui, sans-serif; padding: 12px 16px; border-radius: 22px; border: none; background: transparent; color: var(--fg); outline: none; } /* the row to type in: the box around it holds the chips above (SVG field-box) */
    .field-box { fill: var(--card); stroke: var(--rc-stroke); stroke-width: 1.5; }
    /* sharing points after ↑ on the point (view/points.js): a layer over the screen, only the shapes take touches */
    #share { position: absolute; inset: 0; pointer-events: none; }
    #share .points, #share svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #share [data-role] { pointer-events: auto; cursor: pointer; }
    .badge.admin { fill: var(--rc-stroke); stroke: var(--card); stroke-width: 2; } .fill { fill: var(--sc-stroke); pointer-events: none; } .fill.high { fill: #e57373; }
    #share .note { position: absolute; left: 0; right: 0; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); text-align: center; color: var(--mut); font-size: 0.9em; }
    #share:not([hidden]) .points { animation: sheet-up .22s ease-out; }
    @keyframes sheet-up { from { transform: translateY(30%); opacity: 0; } to { transform: none; opacity: 1; } }
    /* onboarding (onboarding.js, view/hint.js): the next element breathes, a pale point does the gesture */
    .hint { fill: var(--rc-stroke); opacity: 0; pointer-events: none; transform-box: fill-box; transform-origin: center; }
    .hint.tap { animation: hint-tap 1.6s ease-out infinite; } .hint.double-tap { animation: hint-tap .8s ease-out infinite; }
    .hint.hold, .hint.hold-slow { animation: hint-hold 2.2s ease-in-out infinite; } .hint.move { animation: hint-move 1.8s ease-in-out infinite; }
    @keyframes hint-tap { 0% { opacity: 0; transform: scale(1.6); } 30% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
    @keyframes hint-hold { 0% { opacity: 0; transform: scale(1.4); } 20% { opacity: .6; transform: scale(1); } 75% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(.6); } }
    @keyframes hint-move { 0% { opacity: 0; transform: none; } 20% { opacity: .6; transform: none; } 80% { opacity: .6; transform: translate(var(--dx), var(--dy)); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
    .join-group.door { fill: var(--sc); fill-opacity: .35; stroke: var(--sc-stroke); stroke-width: 2.5; stroke-dasharray: 6 4; }
    #context { opacity: 0; transition: opacity .15s; } #context.shown { opacity: 1; }
    #context.breathe input { animation: breathe 1.6s ease-in-out infinite; }
    .hinted, .breathe { animation: breathe 1.6s ease-in-out infinite; } @keyframes breathe { 50% { opacity: .55; } }
    .tile-behind { fill: var(--card); stroke: var(--line); pointer-events: none; }
    .sheet { fill: var(--card); stroke: var(--line); filter: drop-shadow(0 -2px 8px rgba(0,0,0,.08)); }
    .handle { stroke: var(--mut); stroke-width: 4; stroke-linecap: round; }
    .sp { fill: var(--card); stroke: var(--mut); stroke-width: 1.5; }
    .sp.own-device { fill: var(--rc); stroke: var(--rc-stroke); }
    .sp.always { stroke: var(--rc-stroke); stroke-width: 2.5; }
    .sp.shown { fill: var(--sc); }
    .sp.focus { stroke: var(--hold); stroke-width: 4; }
    .sp.waiting, .sp.error, .sp.closed, .sp.device { stroke-dasharray: 5 4; opacity: .55; }
    .sp.add { fill: none; stroke-dasharray: 5 4; } .sp.add.now { stroke: var(--rc-stroke); stroke-width: 2.5; }
    .sp.folder { fill: var(--sc); }
    .sp.group { stroke: var(--sc-stroke); stroke-width: 2.5; }
    .badge { fill: var(--card); stroke: var(--sc-stroke); stroke-width: 2; stroke-dasharray: 3 2; pointer-events: none; } .badge.joined { fill: var(--sc); stroke-dasharray: none; }
    .badge.sealed { fill: var(--sc-stroke); stroke: var(--sc-stroke); stroke-dasharray: none; } .badge.unsealed { fill: none; stroke: var(--rc-stroke); stroke-width: 2.5; stroke-dasharray: 2 2; }
    .view-only { fill: none; stroke: var(--sc-stroke); stroke-width: 1.2; stroke-dasharray: 3 3; pointer-events: none; }
    .chevron { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; } .chevron.own { stroke: var(--rc-stroke); opacity: .7; } .chevron.backup { stroke: var(--rc-stroke); opacity: .9; }
    .join-line { fill: none; stroke: var(--sc-stroke); stroke-width: 3; } .join-line.hello { stroke-dasharray: 2 6; stroke-linecap: round; } .join-line.own { stroke: var(--rc-stroke); }
    .join-me, .join-own { fill: var(--rc); stroke: var(--rc-stroke); stroke-width: 1.5; } .join-group { fill: var(--sc); stroke: var(--sc-stroke); stroke-width: 1.5; }
    .join-group.waiting, .join-own.waiting { fill: none; stroke-dasharray: 3 3; }
    .badge.ran { fill: var(--hold); stroke: var(--hold); stroke-dasharray: none; } .badge.failed { fill: none; stroke: var(--rc-stroke); stroke-dasharray: none; stroke-width: 2.5; }
    .hello { fill: none; stroke: var(--sc-stroke); stroke-width: 2.5; stroke-dasharray: 6 4; } .hello-dot { fill: var(--sc-stroke); pointer-events: none; }
    .sp.cloud { fill: none; stroke: var(--sc-stroke); stroke-width: 2; }
    .sp.incoming { fill: none; stroke: var(--sc-stroke); stroke-width: 2.5; stroke-dasharray: 6 4; } .sp.incoming.there { fill: var(--sc); fill-opacity: .4; }
    .glyph { fill: none; stroke: var(--mut); stroke-width: 1.5; pointer-events: none; }
    .strand.mini { stroke-width: 5; stroke-linecap: round; }
    .hit { fill: none; stroke: transparent; stroke-width: 22; }
    .bridge { fill: none; stroke: var(--rc-stroke); stroke-width: 6; opacity: .35; } .bridge.give { stroke: var(--sc-stroke); stroke-width: 3; opacity: .7; } .chevron.give { stroke: var(--sc-stroke); } .bridge.backup { stroke-dasharray: 3 3; opacity: .6; }
    .label { font: 500 12px Inter, system-ui, sans-serif; fill: var(--fg); pointer-events: none; }
    .chip.on { outline: 2px solid var(--rc-stroke); }
    span.chip { display: inline-block; margin: 4px; padding: 6px 12px; border-radius: 16px; background: var(--sc-stroke); color: #fff; }
  </style>
</head>
<body>
  <div id="screen">
    <video id="live" autoplay muted playsinline disablepictureinpicture poster="data:image/gif;base64,R0lGODlhAQABAAAAACw="></video>
    <video id="replay" hidden playsinline loop disablepictureinpicture poster="data:image/gif;base64,R0lGODlhAQABAAAAACw="></video>
    <video id="template" hidden playsinline muted loop disablepictureinpicture poster="data:image/gif;base64,R0lGODlhAQABAAAAACw="></video>
    <div id="overlay"></div>
  </div>
  <div id="chips" hidden></div>
  <div id="similar" hidden></div>
  <div id="context" hidden><input id="say" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="context"></div>
  <div id="share" hidden></div>
  <script type="module">
    import { start } from './9-ui/app.js';
    const load = (l) => fetch(`0-i18n/locales/${l}.json`).then((r) => r.json());
    const [de, en] = await Promise.all([load('de'), load('en')]);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    start({ locales: { de, en } });
  </script>
</body>
</html>

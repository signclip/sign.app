<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- What this page may load (27.11., audit M9): scripts only from the app's own files (and WebAssembly, and the
       recorder's small worklet as blob:), none from another server, none written into the page. Takes and sharing
       points are data: any https address. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: data: blob: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <meta name="theme-color" content="#e4e2dd">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="9-ui/look.css">
  <title>Sign</title>
</head>
<body>
  <div id="screen" data-role="screen">
    <div id="focus" data-role="window"></div>
    <div id="window" data-role="window">
      <video id="live" autoplay muted playsinline disablepictureinpicture poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
      <video id="replay" hidden playsinline disablepictureinpicture poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
    </div>
    <video id="pickvideo" hidden playsinline muted disablepictureinpicture poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
    <audio id="pickaudio" preload="auto"></audio>
    <div id="similar"></div>
    <svg id="take" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="now"></div>
    <div id="row" data-role="context"></div>
    <div id="over"></div>
    <input id="say" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="context">
    <div id="carry" hidden></div>
    <div id="note"></div>
    <div id="sharing" hidden data-role="sharing">
      <svg id="sharing-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="sharing-html"></div>
    </div>
    <svg id="hint" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <script type="module" src="./9-ui/boot.js"></script>
</body>
</html>
